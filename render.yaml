services:
  - type: web
    name: lm-tech-crm
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python init_db.py && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --keep-alive 5 --access-logfile - --error-logfile - --capture-output
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SECRET_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      - key: COOKIE_SECURE
        value: "1"
      - key: DEV_BYPASS_AUTH
        value: "0"
      - key: DB_STARTUP_ATTEMPTS
        value: "40"
      - key: DB_STARTUP_DELAY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: lm-tech-crm-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_GOOGLE_EMAILS
        sync: false

databases:
  - name: lm-tech-crm-db
    plan: free
    databaseName: lmtechcrm
    user: lmtechcrm
