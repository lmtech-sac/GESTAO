# Use este arquivo somente se você JÁ possui um PostgreSQL no Render e não pode criar outro Free DB.
# Renomeie para render.yaml e preencha DATABASE_URL no painel do Web Service.
services:
  - type: web
    name: lm-tech-crm
    runtime: python
    plan: free
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: bash ./start.sh
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SECRET_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      - key: COOKIE_SECURE
        value: "1"
      - key: DEV_BYPASS_AUTH
        value: "0"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      - key: DB_STARTUP_ATTEMPTS
        value: "40"
      - key: DB_STARTUP_DELAY
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_GOOGLE_EMAILS
        sync: false
