# Blueprint opcional para uso permanente/produção.
# ATENÇÃO: estes planos são pagos no Render.
services:
  - type: web
    name: lm-tech-crm
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      - key: COOKIE_SECURE
        value: "1"
      - key: DEV_BYPASS_AUTH
        value: "0"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      - key: DATABASE_URL
        fromDatabase:
          name: lm-tech-crm-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_GOOGLE_EMAILS
        sync: false

databases:
  - name: lm-tech-crm-db
    plan: basic-256mb
    databaseName: lmtechcrm
    user: lmtechcrm
